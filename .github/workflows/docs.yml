name: Documentation

on:
    push:
        branches:
            - '*'
    pull_request:
        branches:
            - '*'

jobs:
    build:
        runs-on: ubuntu-latest
        timeout-minutes: 20
        permissions:
            contents: read
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                  node-version-file: '.nvmrc'
                  cache: 'npm'
            - name: Install dependencies
              uses: bahmutov/npm-install@v1
              with:
                  install-command: npm ci
            - name: Build docs
              run: npm run build:documentation
            - uses: actions/upload-artifact@v4
              with:
                  name: storybook-dist
                  path: storybook-static

    deploy:
        if: github.ref == 'refs/heads/main'
        needs: build
        runs-on: ubuntu-latest
        timeout-minutes: 10
        permissions:
            contents: write
        steps:
            - uses: actions/download-artifact@v4
              with:
                  name: storybook-dist
                  path: public
            # gh-pages is replaced on every deploy, so the frozen Wave 2 docs are added at /v2/ each time
            - name: Add the Wave 2 docs at /v2/
              uses: actions/checkout@v4
              with:
                  ref: docs-v2
                  path: public/v2
            - run: rm -rf public/v2/.git
            - name: Deploy
              uses: peaceiris/actions-gh-pages@v4
              with:
                  github_token: ${{ secrets.GITHUB_TOKEN }}
                  publish_dir: public
                  cname: wave.free-now.com
